name: Code Quality

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

env:
  PHP_IMAGE: php:8.3-cli@sha256:f1ed6d1fd0aa769ab94ca307b9deaf55fbc18434315b70e319cd79078515cd2b

jobs:
  php-lint:
    name: PHP syntax (php -l)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Lint every PHP file
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "$PHP_IMAGE" sh -c \
            "find . -name '*.php' -not -path './.git/*' -not -path '*/vendor/*' -print0 \
              | xargs -0 -n 50 -P 4 sh -c 'for f; do php -l \"\$f\" >/dev/null || exit 1; done' _"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Lint shell scripts
        run: |
          shellcheck --version
          find . -name '*.sh' -not -path './.git/*' -not -path '*/node_modules/*' -print0 \
            | xargs -0 --no-run-if-empty shellcheck --severity=error
